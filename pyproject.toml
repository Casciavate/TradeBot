[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Systematic, risk-gated trading proposal engine for Interactive Brokers"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = [
    "config*",
    "risk_gate*",
    "data_layer*",
    "signal_layer*",
    "backtest_engine*",
    "approval_layer*",
    "execution_layer*",
    "monitoring*",
]
