[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Systematic, risk-gated trading proposal engine for Interactive Brokers"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

# Jinja templates live inside their packages, so an installed copy needs
# them declared explicitly -- otherwise both dashboards 404 on their own
# template when run from a wheel rather than from the source tree.
[tool.setuptools.package-data]
approval_layer = ["templates/*.html"]
monitoring = ["templates/*.html"]

[tool.setuptools.packages.find]
include = [
    "config*",
    "risk_gate*",
    "data_layer*",
    "signal_layer*",
    "backtest_engine*",
    "approval_layer*",
    "execution_layer*",
    "monitoring*",
]
