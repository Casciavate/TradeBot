<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeBot -- Sign in</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f7f6;
           color: #1a1a1a; display: flex; min-height: 100vh; margin: 0; align-items: center;
           justify-content: center; }
    .box { background: #fff; border: 1px solid #e2e2df; border-radius: 8px; padding: 1.5rem;
           width: min(380px, 92vw); }
    h1 { font-size: 1.1rem; margin: 0 0 .35rem; }
    p { color: #6b6b6b; font-size: .85rem; margin: 0 0 1rem; }
    input { font: inherit; width: 100%; padding: .5rem; border: 1px solid #c4c4c0;
            border-radius: 6px; margin-bottom: .75rem; }
    button { font: inherit; width: 100%; padding: .5rem; border-radius: 6px; border: none;
             background: #1a1a1a; color: #fff; cursor: pointer; font-weight: 600; }
    .err { background: #fbe9e9; border: 1px solid #b4232c; padding: .6rem; border-radius: 6px;
           font-size: .85rem; margin-bottom: .75rem; }
  </style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>TradeBot control center</h1>
    <p>This UI can authorise real orders. Enter the access token.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="token" placeholder="access token" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
